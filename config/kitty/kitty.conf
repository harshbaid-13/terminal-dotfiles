# --- THEME ---
include catppuccin-mocha.conf

# --- OPACITY & BLUR (The Ghostty Vibe) ---
background_opacity 0.9
background_blur 1
dynamic_background_opacity yes

# --- FONTS ---
# Note: Ensure you have a Nerd Font installed for Starship and eza icons
# If you don't have JetBrainsMono, change this to your installed Nerd Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 13.0

# --- WINDOW AESTHETICS ---
window_padding_width 10
hide_window_decorations no
remember_window_size no
initial_window_width  1000
initial_window_height 650

# --- CURSOR ANIMATIONS (From the YouTube Video) ---
cursor_trail 1
cursor_trail_decay 0.1 0.4
cursor_shape block


# BEGIN_KITTY_THEME
# Vague
include current-theme.conf
# END_KITTY_THEME
